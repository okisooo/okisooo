name: WakaTime migration checks
on:
  pull_request:
    paths:
      - .github/wakatime/**
      - .github/workflows/build.yml
      - .github/workflows/wakatime-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test OAuth lifecycle with fake credentials
        run: node --test .github/wakatime/oauth.test.mjs
      - name: Test against the actual pinned renderer plugin
        run: |
          image=ghcr.io/lowlighter/metrics@sha256:257392f90340f916cb8b815026f259399f6b246d3eb7de38b58bfe7a07bd5b65
          docker pull "$image"
          container=$(docker create "$image")
          docker cp "$container:/metrics/source/plugins/wakatime/index.mjs" "$RUNNER_TEMP/wakatime-upstream.mjs"
          docker rm "$container"
          METRICS_PLUGIN_SOURCE="$RUNNER_TEMP/wakatime-upstream.mjs" node --test .github/wakatime/metrics.test.mjs
      - name: Build the OAuth-compatible renderer
        run: docker build -t metrics:forked-3.34.0 .github/wakatime
      - name: Make the mock avatar self-contained
        run: docker build -f .github/wakatime/Mock.Dockerfile -t metrics:forked-3.34.0 .github/wakatime
      - name: Checkout the production Metrics launcher
        uses: actions/checkout@v4
        with:
          repository: lowlighter/metrics
          ref: 65836723097537a54cd8eb90f61839426b4266b6
          path: .metrics-action
          persist-credentials: false
      - name: Verify the local launcher uses the prepared renderer
        uses: ./.metrics-action
        with:
          use_prebuilt_image: no
          use_mocked_data: yes
          retries: 1
          retries_delay: 0
          debug: yes
          output_action: none
          token: MOCKED_TOKEN
          user: okisooo
          filename: launcher.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tokyo
      - name: Verify launcher output
        run: test -s /metrics_renders/launcher.svg
      - name: Smoke-test unchanged rendering with upstream mock data
        run: |
          mkdir -p "$RUNNER_TEMP/wakatime-renders"
          docker run --init --rm --network none --entrypoint node \
            --volume "$RUNNER_TEMP/wakatime-renders:/renders" \
            --volume "$PWD/.github/wakatime/render-smoke.mjs:/render-smoke.mjs:ro" \
            --env INPUT_TOKEN=MOCKED_TOKEN --env INPUT_USER=okisooo \
            --env INPUT_USE_MOCKED_DATA=yes --env INPUT_OUTPUT_ACTION=none \
            --env INPUT_FILENAME=wakatime.svg --env INPUT_TEMPLATE=classic \
            --env INPUT_BASE=header,activity,community,repositories,metadata \
            --env INPUT_CONFIG_TIMEZONE=Asia/Tokyo --env INPUT_PLUGINS_ERRORS_FATAL=yes \
            --env INPUT_PLUGIN_WAKATIME=yes --env INPUT_PLUGIN_WAKATIME_TOKEN=fake-access \
            --env INPUT_PLUGIN_WAKATIME_DAYS=30 --env INPUT_PLUGIN_WAKATIME_LIMIT=5 \
            --env INPUT_PLUGIN_WAKATIME_SECTIONS=time,languages,languages-graphs,editors,os \
            --env INPUT_PLUGIN_WAKATIME_URL=https://wakatime.com --env INPUT_PLUGIN_WAKATIME_USER=current \
            metrics:forked-3.34.0 /render-smoke.mjs
          test -s "$RUNNER_TEMP/wakatime-renders/wakatime.svg"
          python3 - "$RUNNER_TEMP/wakatime-renders/wakatime.svg" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          assert root.tag.endswith('svg')
          text = ''.join(root.itertext())
          assert 'WakaTime' in text or 'wakatime' in text.lower()
          assert 'fake-access' not in text
          assert 'OAuth configuration' not in text
          PY
